[build-system]
build-backend = "poetry.core.masonry.api"
requires = ["poetry-core"]

[tool.poetry]
authors = ["TrisNol <contact@trisnol.dev>"]
description = ""
license = "MIT"
name = "jira-tracker"
packages = [{include = "src"}]
readme = "README.md"
version = "0.0.0"

[tool.poetry.dependencies]
atlassian-python-api = "^5.0.5"
pyinstaller = "^6.13.0"
python = ">=3.12,<3.14"
ttkbootstrap = "^1.12.2"

[tool.poetry.group.dev.dependencies]
pre-commit = "^4.2.0"

[tool.poetry.group.docs]
optional = true

[tool.poetry.group.docs.dependencies]
zensical = ">=0.0.68,<0.0.69"
